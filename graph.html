<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Rocketry Data</title>
  <meta name="description" content="final project for cs408">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <script src="node_modules/chart.js/dist/chart.umd.min.js"></script>
  <script src="js/graph.js"></script>
</head>

<body>
</body>

   <p>
      <a href="index.html">home</a>
   </p>

   <div class="graph_content">

      <div class="graph_window">
         <canvas id="data_graph"></canvas>
      </div>

      <div class="graph_menu">
         <table id='graph-menu-listing-table' class='graph-menu-listing-table'>
         </table>
      </div>

      <div class="graph_selector">
         <table>
             <tr>
                <td>
                   Pe
                </td>
                <td>
                   <label for="send_Pe" hidden>
                      Pe value to use in calculations
                   </label>
                   <input type='text' id='send_Pe' placeholder='---'>
                </td>
                <td>
                   k
                </td>
                <td>
                   <label for="send_k" hidden>
                      k value to use in calculations
                   </label>
                   <input type='text' id='send_k' placeholder='---'>
                </td>
                <td>
                   pp
                </td>
                <td>
                   <label for="send_pp" hidden>
                      pp value to use in calculations
                   </label>
                   <input type='text' id='send_pp' placeholder='---'>
                </td>
                <td>
                   Start Pos
                </td>
                <td>
                   <input type='range' min='0' max='400' value='0' class='slider' id='start_pos' oninput="startChange(this.value)">
                </td>
                <td id='start_pos_out'>
                   0
                </td>
             </tr>
             <tr>
                <td>
                   Pa
                </td>
                <td>
                   <label for="send_Pa" hidden>
                      Pa value to use in calculations
                   </label>
                   <input type='text' id='send_Pa' placeholder='---'>
                </td>
                <td>
                   Ae
                </td>
                <td>
                   <label for="send_Ae" hidden>
                      Ae value to use in calculations
                   </label>
                   <input type='text' id='send_Ae' placeholder='---'>
                </td>
                <td>
                   Selected
                </td>
                <td id="selected_name">
                </td>
                <td>
                   End Pos
                </td>
                <td>
                   <input type='range' min='0' max='400' value='0' class='slider' id='end_pos' oninput="endChange(this.value)">
                </td>
                <td id='end_pos_out'>
                   0
                </td>
             </tr>
             <tr>
                <td>
                   A*
                </td>
                <td>
                   <label for="send_Astar" hidden>
                      A* value to use in calculations
                   </label>
                   <input class="input_field" type='text' id='send_Astar' placeholder='---'>
                </td>
                <td>
                   R
                </td>
                <td>
                   <label for="send_R" hidden>
                      R value to use in calculations
                   </label>
                   <input class="input_field" type='text' id='send_R' placeholder='---'>
                </td>
                <td>
                   Save Name
                </td>
                <td>
                   <label for="send_name" hidden>
                      Name used to save the configuration
                   </label>
                   <input class="input_field" type='text' id='send_name' placeholder='---'>
                </td>
             </tr>
             <tr>
                <td colspan="2">
                   <input type='button' value='Set Values' id='set_values'
                          onClick="computeBaseInformation()">
                </td>
                <td colspan="2">
                   <input type='button' value='Save Configuration' id='save_config'
                          onClick="saveConfig()">
                </td>
             </tr>
         </table>
      </div>

      <div class="graph_output">
         <table>
            <tr>
               <td>
                  To
               </td>
               <td id='to_value_column'>
               </td>
               <td>
                  To Error
               </td>
               <td id='to_error_column'>
               </td>
            </tr>
            <tr>
               <td>
                  Ve
               </td>
               <td id='ve_value_column'>
               </td>
               <td>
                  Ve Error
               </td>
               <td id='ve_error_column'>
               </td>
            </tr>
            <tr>
               <td>
                  Total Impulse
               </td>
               <td id='total_impulse_column'>
               </td>
            </tr>
             <tr>
                <td colspan="2">
                   <input type='button' value='Find Values' id='find_values'
                          onClick="computeValues()">
                </td>
             </tr>
         </table>
      </div>

   </div>
</html>
